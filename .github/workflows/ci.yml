name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install SQLite build dependency
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Verify code
        run: make verify
      - name: Verify documentation contract
        run: sh scripts/check-docs.sh
