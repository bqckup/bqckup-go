name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            packages: gcc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            packages: gcc gcc-aarch64-linux-gnu

    steps:
      - name: Install system toolchain & dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            ${{ matrix.packages }} \
            git make curl tar gzip ca-certificates
          curl -sSfL "https://go.dev/dl/go1.26.0.linux-amd64.tar.gz" | tar -C /usr/local -xzf -
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version & commit
        id: vars
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT

      - name: Build binary with CGO in Ubuntu 20.04
        env:
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          mkdir -p dist
          LDFLAGS="-X github.com/bqckup/bqckup-go/internal/buildinfo.version=${{ steps.vars.outputs.version }} -X github.com/bqckup/bqckup-go/internal/buildinfo.commit=${{ steps.vars.outputs.commit }}"
          go build -ldflags "$LDFLAGS" -o dist/bqckup ./cmd/bqckup

      - name: Package archive
        run: |
          ARCHIVE_NAME="bqckup_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C dist bqckup
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bqckup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.archive_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA-256 checksums manifest
        run: |
          cd release_assets
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.tag }}
          generate_release_notes: true
          files: |
            release_assets/*.tar.gz
            release_assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
