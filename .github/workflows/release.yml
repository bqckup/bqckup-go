name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version to release (for example v0.0.3)'
        required: true
        default: 'v0.0.3'
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      short_commit: ${{ steps.release.outputs.short_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate release version
        id: release
        run: |
          CURRENT_VERSION=$(sed -n 's/^[[:space:]]*version = "\(v[^" ]*\)".*/\1/p' internal/buildinfo/buildinfo.go)
          test -n "$CURRENT_VERSION"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${GITHUB_REF_NAME}" = main
            VERSION="${{ inputs.version }}"
            if [ "$VERSION" != "$CURRENT_VERSION" ]; then
              echo "manual release version must match $CURRENT_VERSION" >&2
              exit 1
            fi
          else
            VERSION="$CURRENT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          sh scripts/check-release.sh "$VERSION"
      - uses: actions/setup-go@v5
        if: steps.release.outputs.should_release == 'true'
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify the release commit
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          make verify
          sh scripts/check-docs.sh

  recreate-tag:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recreate active version tag
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin ":refs/tags/$VERSION" || true
          git tag -fa "$VERSION" "$COMMIT" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION" --force

  build-release:
    needs: [prepare-release, recreate-tag]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
            packages: gcc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            packages: gcc gcc-aarch64-linux-gnu
    steps:
      - name: Install system toolchain and Go
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y ${{ matrix.packages }} git curl tar gzip ca-certificates
          curl -sSfL "https://go.dev/dl/go1.26.5.linux-amd64.tar.gz" | tar -C /usr/local -xzf -
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - name: Build release binary
        env:
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          mkdir -p dist
          LDFLAGS="-X github.com/bqckup/bqckup-go/internal/buildinfo.version=${{ needs.prepare-release.outputs.version }} -X github.com/bqckup/bqckup-go/internal/buildinfo.commit=${{ needs.prepare-release.outputs.short_commit }}"
          go build -buildvcs=false -ldflags "$LDFLAGS" -o dist/bqckup ./cmd/bqckup
          tar -czf "bqckup_${{ needs.prepare-release.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" -C dist bqckup
      - uses: actions/upload-artifact@v4
        with:
          name: bqckup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bqckup_*.tar.gz

  publish-release:
    needs: [prepare-release, build-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: bqckup-linux-*
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > checksums.txt
      - name: Create the GitHub Release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          target_commitish: ${{ needs.prepare-release.outputs.commit }}
          name: ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
