server_id: demo-server
app:
  state_database: data/bqckup.db
  temporary_directory: tmp
  lock_directory: locks
  log_level: info
notifications:
  channels:
    discord-daily:
      type: discord
      webhook_url: http://127.0.0.1:8789
  routes:
    - name: daily-report
      events: [daily_report]
      channels: [discord-daily]
reports:
  daily:
    enabled: true
    timezone: Asia/Makassar
    schedule:
      time: "08:00"
    notification_route: daily-report
    include_empty_days: true
