server_id: 127.0.0.1

app:
  state_database: data/bqckup.db
  temporary_directory: tmp
  lock_directory: locks
  log_level: info
  # log_file: /var/log/bqckup/bqckup.log

# Optional: notify operators when a run reaches a terminal state.
# Notification credentials and URLs are written directly here. Keep this file
# owned by the service account with mode 0600. See docs/configuration-v2.md.
# notifications:
#   channels:
#     email:
#       type: smtp
#       host: <smtp-host>
#       port: 587
#       username: <smtp-user>
#       password: <smtp-password>
#       from: <sender-address>
#       to:
#         - <recipient-address>
#     webhook:
#       type: webhook
#       url: <webhook-url>
#     discord:
#       type: discord
#       webhook_url: <discord-webhook-url>
#   routes:
#     # events options: all | backup_failed | backup_cancelled | backup_no_change
#     - events: [backup_failed]
#       channels: [email, discord, webhook]

# Optional: send scheduled daily and monthly backup summary reports.
# Each report type requires a named notification route (name: field on the
# route) whose channels receive the report. Keep this file at mode 0600.
# reports:
#   daily:
#     enabled: true
#     timezone: UTC
#     schedule:
#       time: "08:00"
#     notification_route: daily-report-route
#     include_empty_days: false
#   monthly:
#     enabled: true
#     timezone: UTC
#     schedule:
#       day_of_month: 1
#       time: "08:00"
#     notification_route: monthly-report-route
#     include_empty_days: false
