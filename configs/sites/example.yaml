version: 2

site:
  name: example
  enabled: true
  sources:
    files:
      include:
        - /srv/example/data
      exclude:
        - /srv/example/data/cache
      follow_symlinks: false
    databases: []
  destinations:
    - storage: local-primary
  policy:
    minimum_interval: 24h
    keep_last: 7
