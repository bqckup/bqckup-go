site:
  name: example
  enabled: true
  # For incremental backups, uncomment these fields and set the password
  # environment variable before running Bqckup. Full mode is the default.
  # backup_mode: incremental
  # incremental:
  #   password: BQCKUP_REPOSITORY_PASSWORD
  sources:
    files:
      include:
        - /srv/example/data
      exclude:
        - /srv/example/data/cache
      follow_symlinks: false
    databases:
      - name: mysql-example
        enabled: false
        engine: mysql
      - name: postgres-example
        enabled: false
        engine: postgres
  destinations:
    - storage: local-primary
  policy:
    minimum_interval: 24h
    keep_last: 7
