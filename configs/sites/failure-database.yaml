site:
  name: failure-database
  enabled: false
  sources:
    files:
      include:
        - /var/lib/bqckup-test/database-fixture
      follow_symlinks: false
    databases:
      - name: mysql-unavailable
        enabled: false
        engine: mysql
        host: 127.0.0.1
        port: 1
        database: bqckup_test
        username: bqckup_test
  destinations:
    - storage: local-main
  policy:
    minimum_interval: 1h
    keep_last: 1
